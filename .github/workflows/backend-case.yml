name: Backend CASE

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  compilar:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar y probar backend CASE
        run: mvn -f backend-case/pom.xml test
