server:
  port: ${PUERTO_BACKEND:8080}

spring:
  application:
    name: backend-case
  datasource:
    url: ${BASE_DATOS_URL:jdbc:postgresql://localhost:5432/proyecto_case}
    username: ${BASE_DATOS_USUARIO:case_user}
    password: ${BASE_DATOS_CLAVE:case_password}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: true
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

caseapp:
  artefactos:
    directorio: ${DIRECTORIO_ARTEFACTOS:generados}
  ai:
    text-proposals:
      enabled: ${AI_TEXT_PROPOSALS_ENABLED:false}
      provider: ${AI_TEXT_PROPOSALS_PROVIDER:deterministic}
      qwen:
        endpoint: ${AI_QWEN_ENDPOINT:http://127.0.0.1:12434/engines/v1/chat/completions}
        model: ${AI_QWEN_MODEL:hf.co/ggml-org/Qwen3.5-0.8B-GGUF:Q4_0}
        connect-timeout-ms: ${AI_QWEN_CONNECT_TIMEOUT_MS:2000}
        read-timeout-ms: ${AI_QWEN_READ_TIMEOUT_MS:120000}
        max-request-bytes: ${AI_QWEN_MAX_REQUEST_BYTES:16000000}
        max-response-bytes: ${AI_QWEN_MAX_RESPONSE_BYTES:32768}
        max-context-bytes: ${AI_QWEN_MAX_CONTEXT_BYTES:8192}
        max-completion-tokens: ${AI_QWEN_MAX_COMPLETION_TOKENS:768}
  qwen:
    photo:
      enabled: ${CU12_PHOTO_QWEN_ENABLED:false}
