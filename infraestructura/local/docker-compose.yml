services:
  base-datos-case:
    image: postgres:16
    container_name: base-datos-case
    environment:
      POSTGRES_DB: proyecto_case
      POSTGRES_USER: case_user
      POSTGRES_PASSWORD: case_password
    ports:
      - "5432:5432"
    volumes:
      - datos_case:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U case_user -d proyecto_case"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-case:
    build:
      context: ../../backend-case
      dockerfile: Dockerfile
    container_name: backend-case
    depends_on:
      base-datos-case:
        condition: service_healthy
    environment:
      BASE_DATOS_URL: jdbc:postgresql://base-datos-case:5432/proyecto_case
      BASE_DATOS_USUARIO: case_user
      BASE_DATOS_CLAVE: case_password
      DIRECTORIO_ARTEFACTOS: /app/generados
    ports:
      - "8080:8080"
    volumes:
      - artefactos_case:/app/generados

volumes:
  datos_case:
  artefactos_case:
