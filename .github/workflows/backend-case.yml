name: Proyecto CASE

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar y probar backend CASE
        run: mvn -f backend-case/pom.xml test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener codigo
        uses: actions/checkout@v4

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend-case/package-lock.json

      - name: Instalar dependencias frontend
        working-directory: frontend-case
        run: npm ci

      - name: Compilar frontend CASE
        working-directory: frontend-case
        run: npm run compilar
