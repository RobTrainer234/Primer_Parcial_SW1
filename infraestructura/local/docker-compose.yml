name: parcial_sw1

services:
  base-datos-case:
    image: postgres:16
    container_name: base-datos-case
    environment:
      POSTGRES_DB: proyecto_case
      POSTGRES_USER: case_user
      POSTGRES_PASSWORD: case_password
    ports:
      - "5432:5432"
    volumes:
      - datos_case:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U case_user -d proyecto_case"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend-case:
    build:
      context: ../../backend-case
      dockerfile: Dockerfile
    container_name: backend-case
    depends_on:
      base-datos-case:
        condition: service_healthy
    environment:
      BASE_DATOS_URL: jdbc:postgresql://base-datos-case:5432/proyecto_case
      BASE_DATOS_USUARIO: case_user
      BASE_DATOS_CLAVE: case_password
      DIRECTORIO_ARTEFACTOS: /app/generados
      AI_TEXT_PROPOSALS_ENABLED: ${AI_TEXT_PROPOSALS_ENABLED:-false}
      AI_TEXT_PROPOSALS_PROVIDER: ${AI_TEXT_PROPOSALS_PROVIDER:-qwen}
      AI_QWEN_ENDPOINT: ${AI_QWEN_ENDPOINT:-http://host.docker.internal:12434/engines/v1/chat/completions}
      CU12_PHOTO_QWEN_ENABLED: ${CU12_PHOTO_QWEN_ENABLED:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8080:8080"
    volumes:
      - artefactos_case:/app/generados

  frontend-case:
    build:
      context: ../../frontend-case
      dockerfile: Dockerfile
    container_name: frontend-case
    depends_on:
      backend-case:
        condition: service_started
    ports:
      - "4200:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  datos_case:
    external: true
    name: local_datos_case
  artefactos_case:
    external: true
    name: local_artefactos_case
